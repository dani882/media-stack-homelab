---
name: media-stack

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - media

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${FAMILY_DIR}:/data
      - ${DOWNLOADS_DIR}:/downloads
      - ${MEDIA_DIR}:/media
    ports:
      - "8989:8989"
    networks:
      - media

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${FAMILY_DIR}:/data
      - ${DOWNLOADS_DIR}:/downloads
      - ${MEDIA_DIR}:/media
    ports:
      - "7878:7878"
    networks:
      - media

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${FAMILY_DIR}:/data
      - ${MEDIA_DIR}:/media
    ports:
      - "6767:6767"
    networks:
      - media

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_DIR}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    networks:
      - media

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: "8888"
      TORRENTING_PORT: "6881"
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${FAMILY_DIR}:/data
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "8888:8888"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - media

  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    container_name: jellyfin
    restart: unless-stopped
    privileged: true
    security_opt:
      - systempaths=unconfined
      - apparmor=unconfined
    environment:
      TZ: ${TZ}
      HEALTHCHECK_URL: http://localhost:8096/health
      JELLYFIN_CACHE_DIR: /cache
      JELLYFIN_CONFIG_DIR: /config/config
      JELLYFIN_DATA_DIR: /config
      JELLYFIN_FFMPEG: /usr/lib/jellyfin-ffmpeg/ffmpeg
      JELLYFIN_LOG_DIR: /config/log
      JELLYFIN_WEB_DIR: /jellyfin/jellyfin-web
      LIBVA_DRIVER_NAME: rockchip
      MPP_SERVICE: "1"
      XDG_CACHE_HOME: /cache
    volumes:
      - ${CONFIG_DIR}/jellyfin/config:/config
      - ${CONFIG_DIR}/jellyfin/cache:/cache
      - ${CONFIG_DIR}/jellyfin/plugins:/config/plugins
      - ${MEDIA_DIR}:/data
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mali0:/dev/mali0
      - /dev/rga:/dev/rga
      - /dev/mpp_service:/dev/mpp_service
    ports:
      - "8899:8096"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --noproxy localhost -Lk -fsS
          http://localhost:8096/health || exit 1
      interval: 30s
      timeout: 30s
      start_period: 10s
      retries: 3
    networks:
      - media

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - "8191:8191"
    networks:
      - media

  recyclarr:
    profiles: ["tools"]
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/recyclarr:/config
    networks:
      - media

networks:
  media:
    name: media-stack
    driver: bridge
