---
name: media-stack

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    ports:
      - "9696:9696"
    networks:
      - media

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${FAMILY_DIR}:/data
      - ${DOWNLOADS_DIR}:/downloads
      - ${MEDIA_DIR}:/media
    ports:
      - "8989:8989"
    networks:
      - media

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${FAMILY_DIR}:/data
      - ${DOWNLOADS_DIR}:/downloads
      - ${MEDIA_DIR}:/media
    ports:
      - "7878:7878"
    networks:
      - media

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${FAMILY_DIR}:/data
      - ${MEDIA_DIR}:/media
    ports:
      - "6767:6767"
    networks:
      - media

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_DIR}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    networks:
      - media

  profilarr:
    profiles: ["profilarr"]
    image: ghcr.io/dictionarry-hub/profilarr:${PROFILARR_TAG:-latest}
    container_name: profilarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      PARSER_HOST: profilarr-parser
      PARSER_PORT: "5000"
    volumes:
      - ${CONFIG_DIR}/profilarr:/config
    ports:
      - "${PROFILARR_PORT:-6868}:6868"
    depends_on:
      - profilarr-parser
    networks:
      - media

  profilarr-parser:
    profiles: ["profilarr"]
    image: ghcr.io/dictionarry-hub/profilarr-parser:${PROFILARR_TAG:-latest}
    container_name: profilarr-parser
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - media

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: "8888"
      TORRENTING_PORT: "6881"
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${FAMILY_DIR}:/data
      - ${DOWNLOADS_DIR}:/downloads
    ports:
      - "8888:8888"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - media

  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    container_name: jellyfin
    restart: unless-stopped
    privileged: true
    security_opt:
      - systempaths=unconfined
      - apparmor=unconfined
    environment:
      TZ: ${TZ}
      HEALTHCHECK_URL: http://localhost:8096/health
      JELLYFIN_CACHE_DIR: /cache
      JELLYFIN_CONFIG_DIR: /config/config
      JELLYFIN_DATA_DIR: /config
      JELLYFIN_FFMPEG: /usr/lib/jellyfin-ffmpeg/ffmpeg
      JELLYFIN_LOG_DIR: /config/log
      JELLYFIN_WEB_DIR: /jellyfin/jellyfin-web
      LIBVA_DRIVER_NAME: rockchip
      MPP_SERVICE: "1"
      XDG_CACHE_HOME: /cache
    volumes:
      - ${CONFIG_DIR}/jellyfin/config:/config
      - ${CONFIG_DIR}/jellyfin/cache:/cache
      - ${CONFIG_DIR}/jellyfin/plugins:/config/plugins
      - ${MEDIA_DIR}:/data
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/mali0:/dev/mali0
      - /dev/rga:/dev/rga
      - /dev/mpp_service:/dev/mpp_service
    ports:
      - "8899:8096"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --noproxy localhost -Lk -fsS
          http://localhost:8096/health || exit 1
      interval: 30s
      timeout: 30s
      start_period: 10s
      retries: 3
    networks:
      - media

  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:${DISPATCHARR_TAG:-latest}
    container_name: dispatcharr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
    volumes:
      - ${CONFIG_DIR}/dispatcharr:/data
    ports:
      - "${DISPATCHARR_PORT:-9191}:9191"
    networks:
      - media

  dominican-iptv:
    build:
      context: .
      dockerfile: dominican-iptv.Dockerfile
    image: homelab/dominican-iptv:local
    container_name: dominican-iptv
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUBLIC_BASE_URL: http://dominican-iptv:8080
      CACHE_TTL: "21600"
      RESOLVER_TTL: "21600"
      HEALTH_MAX_AGE: "86400"
      DEAD_RETENTION: "604800"
      EPG_URL: >-
        ${DOMINICAN_EPG_URL:-https://epgshare01.online/epgshare01/epg_ripper_DO1.xml.gz}
      DOMINICAN_EXIT_NODE_ENABLED: ${DOMINICAN_EXIT_NODE_ENABLED:-0}
    command: ["serve"]
    volumes:
      - ${CONFIG_DIR}/dominican-iptv:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - media

  dominican-iptv-monitor:
    build:
      context: .
      dockerfile: dominican-iptv.Dockerfile
    image: homelab/dominican-iptv:local
    container_name: dominican-iptv-monitor
    restart: unless-stopped
    depends_on:
      dominican-iptv:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      PLAYLIST_URL: http://dominican-iptv:8080/playlist.m3u
      PUBLIC_BASE_URL: http://dominican-iptv:8080
      PROBE_INTERVAL: ${DOMINICAN_IPTV_PROBE_INTERVAL:-21600}
      PROBE_TIMEOUT: ${DOMINICAN_IPTV_PROBE_TIMEOUT:-12}
      PROBE_WORKERS: ${DOMINICAN_IPTV_PROBE_WORKERS:-10}
      CACHE_TTL: "21600"
      RESOLVER_TTL: "21600"
      HEALTH_MAX_AGE: "86400"
      DEAD_RETENTION: "604800"
      EPG_URL: >-
        ${DOMINICAN_EPG_URL:-https://epgshare01.online/epgshare01/epg_ripper_DO1.xml.gz}
    command: ["monitor"]
    volumes:
      - ${CONFIG_DIR}/dominican-iptv:/data
    networks:
      - media

  # Optional Dominican egress. It stays dormant until the Raspberry Pi is
  # registered as a Tailscale exit node and this Compose profile is enabled.
  dominican-exit:
    image: tailscale/tailscale:stable
    container_name: dominican-exit
    hostname: media-dominican-exit-client
    restart: unless-stopped
    profiles: ["dominican-exit"]
    environment:
      TS_AUTHKEY: ${DOMINICAN_TAILSCALE_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: >-
        --exit-node=${DOMINICAN_TAILSCALE_EXIT_NODE:-}
        --exit-node-allow-lan-access=true
    volumes:
      - ${CONFIG_DIR}/tailscale-dominican-exit:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    networks:
      - media

  dominican-iptv-dr:
    image: homelab/dominican-iptv:local
    container_name: dominican-iptv-dr
    restart: unless-stopped
    profiles: ["dominican-exit"]
    depends_on:
      - dominican-exit
    network_mode: service:dominican-exit
    environment:
      PORT: "8081"
      REQUEST_TIMEOUT: "30"
    command: ["relay"]

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - "8191:8191"
    networks:
      - media

  recyclarr:
    profiles: ["tools"]
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/recyclarr:/config
    networks:
      - media

networks:
  media:
    name: media-stack
    driver: bridge
